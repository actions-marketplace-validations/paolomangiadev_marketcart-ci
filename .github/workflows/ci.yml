name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: node engine/cli.ts bench
  action-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: demo
  action-v0:
    # the published major tag, as users reference it
    runs-on: ubuntu-latest
    steps:
      - uses: paolomangiadev/marketcart-ci@v0
        with:
          mode: demo
